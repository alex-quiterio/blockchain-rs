# A three-node network in a line: c knows b, b knows a. Introductions make every link two-way,
# and discovery links a and c directly once b has heard from both.
#
#   docker compose up --build
#
# Then open http://localhost:3000, :3001 and :3002. Mine on one node and watch the block reach
# the others. For proof of stake: CONSENSUS=pos docker compose up --build
# To show the real commit in the UI footer: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up --build

name: blockchain-rs

x-node: &node
  image: blockchain-rs:local
  restart: unless-stopped
  environment: &env
    CONSENSUS: ${CONSENSUS:-pow}
    DIFFICULTY: ${DIFFICULTY:-4}
    TARGET_BLOCK_SECS: ${TARGET_BLOCK_SECS:-10}
    RETARGET_BLOCKS: ${RETARGET_BLOCKS:-10}
    MAX_BLOCK_TRANSFERS: ${MAX_BLOCK_TRANSFERS:-100}
    SYNC_SECS: ${SYNC_SECS:-3}
    RUST_LOG: info

services:
  node-a:
    <<: *node
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-docker}
    ports: ["3000:3000"]
    environment:
      <<: *env
      PUBLIC_URL: http://node-a:3000
    volumes: [node-a:/data]

  node-b:
    <<: *node
    depends_on: [node-a]
    ports: ["3001:3000"]
    environment:
      <<: *env
      PUBLIC_URL: http://node-b:3000
      PEERS: http://node-a:3000
    volumes: [node-b:/data]

  node-c:
    <<: *node
    depends_on: [node-b]
    ports: ["3002:3000"]
    environment:
      <<: *env
      PUBLIC_URL: http://node-c:3000
      PEERS: http://node-b:3000
    volumes: [node-c:/data]

  # Floods the three nodes with random transactions and prints how they cope:
  #   docker compose --profile load run --rm loadgen
  loadgen:
    image: blockchain-rs:local
    profiles: [load]
    depends_on: [node-a, node-b, node-c]
    command: ["loadgen"]
    environment:
      NODES: http://node-a:3000,http://node-b:3000,http://node-c:3000
      RATE: ${RATE:-20}
      SECS: ${SECS:-60}
      WALLETS: ${WALLETS:-12}
      BLOCK_EVERY: ${BLOCK_EVERY:-5}
      MAX_FEE: ${MAX_FEE:-5}

volumes:
  node-a:
  node-b:
  node-c:
