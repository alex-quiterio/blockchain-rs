name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The tests write the API's bodies out as TypeScript for the web UI, whose types are checked
      # against them. A change to a body has to come with the regenerated file, so the UI can't
      # drift from the node unnoticed.
      - name: The web UI's copy of the API types is up to date
        run: |
          wire=web/src/infrastructure/node_wire.ts
          if [ -n "$(git status --porcelain -- "$wire")" ]; then
            echo "$wire is out of date. Run cargo test and commit it:"
            git diff -- "$wire"
            exit 1
          fi

  # The web UI: TypeScript in web/, built into public/, which is build output only.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: public/ is build output, never committed
        run: |
          if [ -n "$(git ls-files public)" ]; then
            echo "These are tracked under public/, which npm run build writes:"
            git ls-files public
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Both pages, end to end, in headless Chrome against fresh nodes of each consensus. The runner
  # comes with Chrome.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --bin blockchain
      - run: npm run e2e
