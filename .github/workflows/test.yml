name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The web UI: TypeScript in web/, built into public/, which is build output only. Its check
  # generates the node's bodies from the Rust code first, so it needs Rust too.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: public/ and the generated API types are never committed
        run: |
          tracked=$(git ls-files public web/src/infrastructure/node_wire.ts)
          if [ -n "$tracked" ]; then
            echo "These are tracked, but npm run build or cargo test writes them:"
            echo "$tracked"
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Both pages, end to end, in headless Chrome against fresh nodes of each consensus. The runner
  # comes with Chrome.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --bin blockchain
      - run: npm run e2e
